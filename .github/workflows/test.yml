name: CI - clonando App y ejecutando tests

on: 
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mongo:
        image: mongo:6.0
        ports:
          - 27017:27017
        
    env:
      MONGO_URI: ${{ secrets.MONGO_URI }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      PORT: 6007
      VITE_API_URL: http://localhost:6007/api
 
    steps:
    - name: Checkout repo actual (con el workflow)
      uses: actions/checkout@v3

    - name: Clonar repo Athena Reux Bank 
      run: |
        git clone https://github.com/engineerqajimenez-jpg/taller-playwright-atenea.git app

    - name: Crear archivos .env para el backend
      run: |
          mkdir -p app/backend
          echo "MONGO_URI=${{ secrets.MONGO_URI }}" >> app/backend/.env
          echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> app/backend/.env
          echo "PORT=${{ env.PORT }}" >> app/backend/.env
          echo "VITE_API_URL=${{ env.VITE_API_URL }}" >> app/backend/.env

    - name: Instalar dependencias de backend
      run: |
        cd app/backend
        npm install

    - name: Construir backend
      run: |
        cd app/backend
        npm run dev > backend.log 2>&1 &

    - name: Instalar wait-on
      run: npm install -g wait-on

    - name: Esperar a que el backend esté disponible
      run: wait-on tcp:6007   

    - name: Instalar dependencias del frontend
      run: |
        cd app/frontend
        npm install

    - name: Esperar a que el frontend esté disponible
      run: wait-on http://localhost:3000
    - name: Ejecutar tests 
      run: |
        cd app/frontend
        npm run test
