name: CI - clonando App y ejecutando tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mongo:
        image: mongo:6.0
        ports:
          - 27017:27017

    env:
      MONGO_URI: ${{ secrets.MONGO_URI }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      PORT: 6007
      VITE_API_URL: http://localhost:6007/api

    steps:
    - name: Checkout repo de tests
      uses: actions/checkout@v4

    - name: Clonar app Redux Athena Bank
      run: |
        git clone https://github.com/Atenea-Conocimientos/redux-athena-bank.git redux-athena-bank

    - name: Crear .env para el backend
      run: |
        cat > redux-athena-bank/backend/.env << EOF
        MONGO_URI=${{ env.MONGO_URI }}
        JWT_SECRET=${{ env.JWT_SECRET }}
        PORT=${{ env.PORT }}
        VITE_API_URL=${{ env.VITE_API_URL }}
        EOF

    - name: Instalar y levantar backend
      run: |
        cd redux-athena-bank/backend
        npm install
        nohup node src/server.js > backend.log 2>&1 &
        sleep 10

    - name: Esperar backend (puerto 6007)
      run: npx wait-on tcp:6007 --timeout 60000

    - name: Instalar y levantar frontend
      env:
        VITE_API_URL: http://localhost:6007/api
      run: |
        cd redux-athena-bank/frontend
        npm install
        nohup npm run dev -- --port 3000 > frontend.log 2>&1 &

    - name: Esperar frontend (puerto 3000)
      run: npx wait-on http://localhost:3000 --timeout 90000

    - name: Instalar dependencias de Playwright
      run: npm install

    - name: Instalar browsers de Playwright
      run: npx playwright install --with-deps chromium

    - name: Crear carpeta auth
      run: mkdir -p playwright/.auth

    - name: Run Playwright tests
      env:
        USER_ENVIA_EMAIL: ${{ secrets.USER_ENVIA_EMAIL }}
        USER_ENVIA_PASS: ${{ secrets.USER_ENVIA_PASS }}
      run: npx playwright test

    - name: Subir reporte HTML si falla
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: playwright-report/

    - name: Deploy Playwright report to GitHub Pages
      if: always()
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        cd $RUNNER_TEMP
        git clone --depth=1 --branch=gh-pages https://x-access-token:${{ secrets.GH_PAGES_PAT }}@github.com/${{ github.repository }}.git gh-pages-dir
        cd gh-pages-dir
        rm -rf ./*
        mkdir -p report-${{ github.run_number }}
        cp -r $GITHUB_WORKSPACE/playwright-report/* ./report-${{ github.run_number }}/
        git add .
        git commit -m "📊 Reporte Playwright - Build ${{ github.run_number }}"
        git push origin gh-pages

    - name: Imprimir link del reporte
      if: always()
      run: |
        echo "🔗 Reporte disponible en: https://engineerqajimenez-jpg.github.io/taller-playwright-atenea/report-${{ github.run_number }}/"